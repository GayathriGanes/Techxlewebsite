<div 
  [ngClass]="{'banner1': showBanner}" 
  [ngStyle]="{'background-color': showBanner ? ' #edf1fd' : 'transparent'}">
  <div class="container py-5">
    <div class="row align-items-start mt-5">
      <div class="col-md-6 text-left">
        <h5 class="text-get">GET IN TOUCH</h5>
        <h1 class="font">Have a Project? We Would Love to Hear From You</h1>
      </div>
      <div class="col-md-6">
        <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
          <div class="form-group mt-5">
            <label for="name">Name</label>
            <input type="text" class="form-control mt-2" id="name" formControlName="name" />
            <div *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched" class="text-danger">
              Name is required
            </div>
          </div>
          <div class="form-group mt-4">
            <label for="email">Email ID</label>
            <input type="email" class="form-control mt-2" id="email" placeholder="name@example.com" formControlName="email" />
            <div *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched" class="text-danger">
              <div *ngIf="contactForm.get('email')?.errors?.['required']">Email is required</div>
              <div *ngIf="contactForm.get('email')?.errors?.['email']">Please enter a valid email</div>
            </div>
          </div>
          <div class="form-group mt-4">
            <label for="service-type">Service Type</label>
            <select class="form-control custom-select mt-2" id="service-type" formControlName="service_type">
              <option value="" disabled>Select a service type</option>
              <option value="Power Platform Development">Power Platform Development</option>
              <option value="Cloud App Development">Cloud App Development</option>
              <option value="Staffing Service">Staffing Service</option>
              <option value="UI/UX Designing">UI/UX Designing</option>
              <option value="Full Stack Development">Full Stack Development</option>
              <option value="AI Application">AI Application</option>
              <option value="DevOps">DevOps</option>
              <option value="Other">Other</option>
            </select>
            <div *ngIf="contactForm.get('service_type')?.invalid && contactForm.get('service_type')?.touched" class="text-danger">
              Service type is required
            </div>
          </div>
          <div class="form-group mt-4">
            <label for="message">Message</label>
            <textarea class="form-control mt-2" id="message" rows="4" formControlName="message"></textarea>
            <div *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched" class="text-danger">
              Message is required
            </div>
          </div>
          <button mat-button type="submit" class=" read-more-button mt-4">
            <span class="button-text">Send Enquiry</span>
            <span><img src="./assets/images/Icons (1).svg" alt="Techxle Logo" class="icon" /></span>
          </button>
          <div *ngIf="successMessage" class="alert alert-success mt-3">{{ successMessage }}</div>
          <div *ngIf="errorMessage" class="alert alert-danger mt-3">{{ errorMessage }}</div>
        </form>
      </div>
    </div>
  </div>
</div>
